<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SpeakEasy AAC</title>
<style>
:root{--bg:#f7f3ee;--panel:#fff;--ink:#2d2a28;--muted:#746f6a;--accent:#6f8b78;--line:#ded8d1;--shadow:0 5px 16px rgba(50,45,40,.10)}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden}
header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 14px}.brand{font-weight:800;font-size:20px;white-space:nowrap}.spacer{flex:1}
button{font:inherit;color:inherit}.topbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font-weight:700;cursor:pointer}.topbtn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
main{height:calc(100vh - 64px);display:grid;grid-template-columns:180px 1fr}.sidebar{background:#fff;border-right:1px solid var(--line);padding:12px;overflow:auto}.navbtn{width:100%;border:0;background:transparent;text-align:left;padding:13px 12px;border-radius:12px;margin-bottom:5px;font-weight:750;cursor:pointer}.navbtn.active,.navbtn:hover{background:#eef2ef}
.workspace{display:flex;flex-direction:column;min-width:0}.message{margin:12px 12px 0;background:#fff;border:1px solid var(--line);border-radius:15px;min-height:70px;display:flex;align-items:center;padding:8px;box-shadow:var(--shadow)}#messageText{flex:1;font-size:26px;font-weight:700;padding:0 12px;white-space:nowrap;overflow:auto}.msgbtn{height:50px;min-width:58px;border:0;border-radius:11px;margin-left:6px;font-weight:800;cursor:pointer}.speak{background:var(--accent);color:white}.clear{background:#eee8e2}.backspace{background:#f3eee9}
.grid{padding:12px;display:grid;grid-template-columns:repeat(5,minmax(110px,1fr));grid-auto-rows:minmax(115px,1fr);gap:10px;overflow:auto;flex:1}.aac{border:2px solid #d7d0c9;border-radius:16px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:115px;cursor:pointer;position:relative;padding:8px;user-select:none}.aac:active{transform:scale(.98)}.icon{font-size:40px;line-height:1}.label{font-size:20px;font-weight:850;text-align:center}.small{font-size:12px;color:var(--muted)}
.aac.action{background:#e9f0ea;border-color:#9cb1a2}.aac.social{background:#fff3d8;border-color:#dfc985}.aac.need{background:#e8f0f8;border-color:#9eb8d0}.aac.stop{background:#f9e5e2;border-color:#d7a39c}.aac.folder{background:#eee9f5;border-color:#b8a8cf}.editbadge{display:none;position:absolute;right:6px;top:6px;background:#333;color:white;border-radius:8px;padding:3px 6px;font-size:11px}.editing .editbadge{display:block}.editing .aac{outline:2px dashed #9c9187;outline-offset:-5px}
.modalWrap{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:center;justify-content:center;padding:20px}.modal{background:white;width:min(480px,100%);border-radius:18px;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.25)}.modal h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px}.row{display:flex;gap:8px}.row>*{flex:1}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media(max-width:760px){main{grid-template-columns:1fr}.sidebar{display:flex;border-right:0;border-bottom:1px solid var(--line);padding:7px;overflow-x:auto}.navbtn{min-width:max-content;width:auto;margin:0 4px;padding:9px 12px}.grid{grid-template-columns:repeat(3,minmax(90px,1fr));grid-auto-rows:120px}.brand{font-size:16px}.topbtn{padding:8px}.message{min-height:60px}#messageText{font-size:21px}}
</style>
</head>
<body>
<header><div class="brand">SpeakEasy AAC</div><div class="spacer"></div><button class="topbtn" id="voiceBtn">Voice</button><button class="topbtn" id="editBtn">Edit Board</button><button class="topbtn primary" id="fullscreenBtn">Full Screen</button></header>
<main><aside class="sidebar" id="sidebar"></aside><section class="workspace"><div class="message"><div id="messageText" aria-live="polite">Tap words to build a message</div><button class="msgbtn backspace" id="backBtn">⌫</button><button class="msgbtn clear" id="clearBtn">Clear</button><button class="msgbtn speak" id="speakBtn">▶ Speak</button></div><div class="grid" id="grid"></div></section></main>
<div class="modalWrap" id="modalWrap"><div class="modal"><h2>Edit button</h2><div class="field"><label>Button label</label><input id="editLabel"></div><div class="field"><label>Spoken word/phrase</label><input id="editSpeech"></div><div class="row"><div class="field"><label>Picture / emoji</label><input id="editIcon"></div><div class="field"><label>Type</label><select id="editType"><option value="need">Need</option><option value="action">Action</option><option value="social">Social</option><option value="stop">Stop/Regulation</option><option value="folder">Folder</option></select></div></div><div class="modalActions"><button class="topbtn" id="cancelEdit">Cancel</button><button class="topbtn primary" id="saveEdit">Save</button></div></div></div>
<script>
const defaults={
Core:[['I','I','👤','social'],['want','want','👉','action'],['more','more','➕','action'],['help','help','🙋','need'],['break','break','⏸️','stop'],['all done','all done','✅','stop'],['yes','yes','👍','social'],['no','no','👎','stop'],['go','go','➡️','action'],['stop','stop','✋','stop'],['my','my','🫶','social'],['you','you','🫵','social'],['like','like','❤️','social'],['not','not','🚫','stop'],['please','please','🙏','social']],
Food:[['eat','eat','🍽️','action'],['drink','drink','🥤','action'],['water','water','💧','need'],['snack','snack','🍪','need'],['Goldfish','Goldfish','🐟','need'],['apple','apple','🍎','need'],['banana','banana','🍌','need'],['milk','milk','🥛','need'],['open','open','📂','action'],['more','more','➕','action'],['all done','all done','✅','stop']],
Play:[['play','play','🧸','action'],['ball','ball','⚽','need'],['bubbles','bubbles','🫧','need'],['swing','swing','🎠','need'],['outside','outside','🌳','need'],['music','music','🎵','need'],['tablet','tablet','📱','need'],['turn','turn','🔁','social'],['again','again','🔄','action'],['go','go','➡️','action'],['stop','stop','✋','stop']],
Feelings:[['happy','happy','😊','social'],['sad','sad','😢','social'],['mad','mad','😠','social'],['scared','scared','😟','social'],['tired','tired','😴','need'],['hurt','hurt','🤕','need'],['too loud','too loud','🔊','stop'],['quiet','quiet','🤫','need'],['break','I need a break','⏸️','stop']],
People:[['Mom','Mom','👩','social'],['Dad','Dad','👨','social'],['teacher','teacher','🧑‍🏫','social'],['friend','friend','🧒','social'],['me','me','👤','social']],
Places:[['bathroom','bathroom','🚻','need'],['home','home','🏠','need'],['school','school','🏫','need'],['outside','outside','🌳','need'],['car','car','🚗','need']]
};
let boards=JSON.parse(localStorage.getItem('speakeasyBoards')||'null')||defaults;let page='Core',message=[],editing=false,currentEdit=null;let selectedVoice=null;
function save(){localStorage.setItem('speakeasyBoards',JSON.stringify(boards))}
function renderNav(){sidebar.innerHTML='';Object.keys(boards).forEach(p=>{let b=document.createElement('button');b.className='navbtn'+(p===page?' active':'');b.textContent=p;b.onclick=()=>{page=p;render()};sidebar.appendChild(b)})}
function render(){renderNav();grid.innerHTML='';document.body.classList.toggle('editing',editing);boards[page].forEach((item,i)=>{let [label,speech,icon,type]=item;let b=document.createElement('button');b.className='aac '+type;b.innerHTML=`<span class="editbadge">EDIT</span><span class="icon">${icon||'💬'}</span><span class="label">${label}</span>`;b.onclick=()=>editing?openEdit(i):press(item);grid.appendChild(b)});updateMessage()}
function press(item){let [label,speech]=item;message.push({label,speech});updateMessage();speak(speech)}
function updateMessage(){messageText.textContent=message.length?message.map(x=>x.label).join(' '):'Tap words to build a message'}
function speak(text){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);if(selectedVoice)u.voice=selectedVoice;u.rate=.92;window.speechSynthesis.speak(u)}
function loadVoices(){let v=speechSynthesis.getVoices().filter(x=>x.lang.startsWith('en'));if(!selectedVoice)selectedVoice=v.find(x=>/Samantha|Ava|Google US English|Female/i.test(x.name))||v[0];voiceBtn.title=selectedVoice?selectedVoice.name:'System voice'}
if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
speakBtn.onclick=()=>{if(message.length)speak(message.map(x=>x.speech).join(' '))};clearBtn.onclick=()=>{message=[];updateMessage()};backBtn.onclick=()=>{message.pop();updateMessage()};
editBtn.onclick=()=>{editing=!editing;editBtn.textContent=editing?'Done Editing':'Edit Board';render()};fullscreenBtn.onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
voiceBtn.onclick=()=>{let vs=speechSynthesis.getVoices().filter(x=>x.lang.startsWith('en'));if(!vs.length)return;let idx=Math.max(0,vs.indexOf(selectedVoice));selectedVoice=vs[(idx+1)%vs.length];voiceBtn.textContent='Voice: '+selectedVoice.name.split(' ')[0];speak('Hello')};
function openEdit(i){currentEdit=i;let x=boards[page][i];editLabel.value=x[0];editSpeech.value=x[1];editIcon.value=x[2];editType.value=x[3];modalWrap.style.display='flex'}
cancelEdit.onclick=()=>modalWrap.style.display='none';saveEdit.onclick=()=>{boards[page][currentEdit]=[editLabel.value.trim()||'Word',editSpeech.value.trim()||editLabel.value.trim()||'Word',editIcon.value.trim()||'💬',editType.value];save();modalWrap.style.display='none';render()};
modalWrap.onclick=e=>{if(e.target===modalWrap)modalWrap.style.display='none'};render();
</script>
</body></html>
